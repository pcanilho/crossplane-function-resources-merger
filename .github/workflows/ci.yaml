name: CI

# Least privilege by default; jobs that need more request it.
permissions:
  contents: read

on:
  push:
    paths-ignore:
      - README.md
      - .gitignore
    branches:
      - main
      - release-*
    # Path filters are not evaluated for tag pushes, so paths-ignore above
    # cannot suppress a release.
    tags:
      - v*
  pull_request: {}
  workflow_dispatch:
    inputs:
      version:
        description: Package version (e.g. v0.1.0)
        required: false

env:
  GO_VERSION: '1.27.0'
  GOLANGCI_VERSION: 'v2.13.2'
  KO_VERSION: 'v0.19.1'

  # Pinned. Previously tracked the master channel, so every published package
  # was built by an unreleased nightly CLI.
  #
  # XP_VERSION and XP_CORE_VERSION version independently: XP_VERSION is the
  # crossplane/cli release used by install.sh, XP_CORE_VERSION is the
  # crossplane/crossplane core image used for --crossplane-image. Do not
  # re-merge these into one var.
  XP_VERSION: 'v2.5.0'
  XP_CORE_VERSION: 'v2.4.0'

  XPKG: ghcr.io/${{ github.repository }}
  # The Marketplace repository name follows the package's metadata.name, not
  # the GitHub repository name.
  XPKG_UPBOUND: xpkg.upbound.io/pcanilho/function-resources-merger
  # workflow_dispatch supplies the version explicitly; a v* tag push supplies
  # its own name. Empty on a branch push, which selects the v0.0.0- fallback.
  XPKG_VERSION: ${{ inputs.version || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}

  unit-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Unit Tests
        run: go test -v -cover ./...

      - name: Setup the Crossplane CLI
        run: curl -sfL https://cli.crossplane.io/install.sh | XP_VERSION=${{ env.XP_VERSION }} sh

      - name: Validate function input
        run: ./crossplane resource validate package/input example/composition.yaml --error-on-missing-schemas

      - name: Render golden file
        run: |
          go run . --insecure &
          FN_PID=$!

          # go run keeps the compiled binary as a separate child process, so
          # killing FN_PID alone can leave it holding the port. Kill whatever
          # is actually listening on 9443 as the authoritative cleanup.
          cleanup() {
            kill "$FN_PID" 2>/dev/null || true
            PORT_PIDS=$(lsof -ti :9443 2>/dev/null || true)
            if [ -n "$PORT_PIDS" ]; then
              kill -9 $PORT_PIDS 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/9443) 2>/dev/null; then
              exec 3<&- 3>&-
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "function did not start listening on :9443 in time" >&2
              exit 1
            fi
            sleep 1
          done

          # crossplane composition render still shells out to Docker to run
          # the render engine itself; only the function call is local, per
          # the render.crossplane.io/runtime: Development annotation.
          ./crossplane composition render example/xr.yaml example/composition.yaml example/functions.yaml \
            --xrd example/xrd.yaml \
            --required-resources example/required-resources.yaml \
            --crossplane-image xpkg.crossplane.io/crossplane/crossplane:${{ env.XP_CORE_VERSION }} \
            > rendered.yaml

          diff -u example/rendered.golden.yaml rendered.yaml

          # Render cannot exercise the scope gate: its in-memory client
          # hardcodes IsObjectNamespaced. It does cover the merge and the key.
          ./crossplane composition render example/namespaced/xr.yaml example/namespaced/composition.yaml example/namespaced/functions.yaml \
            --xrd example/namespaced/xrd.yaml \
            --required-resources example/namespaced/required-resources.yaml \
            --crossplane-image xpkg.crossplane.io/crossplane/crossplane:${{ env.XP_CORE_VERSION }} \
            > rendered-namespaced.yaml

          diff -u example/namespaced/rendered.golden.yaml rendered-namespaced.yaml

  build:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup ko
        uses: ko-build/setup-ko@v0.10
        with:
          version: ${{ env.KO_VERSION }}

      # --push=false with a non-ko.local KO_DOCKER_REPO selects the tarball
      # publisher. See .ko.yaml.
      - name: Build Runtime Image
        env:
          KO_DOCKER_REPO: ${{ env.XPKG }}
        run: |
          ko build \
            --push=false \
            --bare \
            --platform=linux/${{ matrix.arch }} \
            --tarball=runtime-${{ matrix.arch }}.tar \
            --sbom=spdx \
            --sbom-dir=. \
            .

      - name: Setup the Crossplane CLI
        run: curl -sfL https://cli.crossplane.io/install.sh | XP_VERSION=${{ env.XP_VERSION }} sh

      - name: Build Package
        run: ./crossplane xpkg build --package-file=${{ matrix.arch }}.xpkg --package-root=package/ --embed-runtime-image-tarball=runtime-${{ matrix.arch }}.tar

      - name: Upload Single-Platform Package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.arch }}
          path: |
            *.xpkg
            *.spdx.json
          if-no-files-found: error
          retention-days: 1

  push:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    # Without this, every same-repo PR publishes a package built from
    # unreviewed code: GITHUB_TOKEN still carries packages: write.
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: write # gh release create
      packages: write # ghcr.io push
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Single-Platform Packages
        uses: actions/download-artifact@v8
        with:
          path: .
          merge-multiple: true

      - name: Setup the Crossplane CLI
        run: curl -sfL https://cli.crossplane.io/install.sh | XP_VERSION=${{ env.XP_VERSION }} sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # github.actor is dependabot[bot] on bot runs and cannot authenticate.
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract changelog section
        id: notes
        if: env.XPKG_VERSION != ''
        env:
          TAG: ${{ env.XPKG_VERSION }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes_file="$RUNNER_TEMP/notes.md"
          # Extract the body of the matching '## [version]' section, stopping
          # at the next '## [' header or EOF. The header line itself is dropped
          # (the release title already shows the version).
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/           { exit }
            found                        { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "::error::No CHANGELOG.md section found for ${TAG} (looked for '## [${version}]'). Add the section before tagging."
            exit 1
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Generate new Release
        if: env.XPKG_VERSION != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.XPKG_VERSION }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          case "$TAG" in *-*) prerelease_flag="--prerelease" ;; esac
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            $prerelease_flag *.xpkg

      # Registries only publish valid semver tags, hence the v0.0.0- prefix.
      - name: Set Default Multi-Platform Package Version
        if: env.XPKG_VERSION == ''
        run: echo "XPKG_VERSION=v0.0.0-$(date -d@$(git show -s --format=%ct) +%Y%m%d%H%M%S)-$(git rev-parse --short=12 HEAD)" >> $GITHUB_ENV

      - name: Push Multi-Platform Package to the GitHub Container Registry
        run: "./crossplane --verbose xpkg push --package-files $(echo *.xpkg|tr ' ' ,) ${XPKG@L}:${{ env.XPKG_VERSION }}"

      # Only tagged releases reach the Marketplace. Branch pushes carry the
      # v0.0.0- fallback version and stay on ghcr.io.
      #
      # Personal API tokens are rejected by the registry: it silently falls
      # back to anonymous and grants pull only. This must be a robot token,
      # and the robot needs a team with write access to the repository.
      - name: Login to the Upbound Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_UPBOUND != 'false'
        uses: docker/login-action@v4
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.UPBOUND_ACCESS_ID }}
          password: ${{ secrets.UPBOUND_TOKEN }}

      - name: Push Multi-Platform Package to the Upbound Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_UPBOUND != 'false'
        run: "./crossplane --verbose xpkg push --package-files $(echo *.xpkg|tr ' ' ,) ${XPKG_UPBOUND}:${{ env.XPKG_VERSION }}"
