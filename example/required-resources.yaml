apiVersion: v1
kind: ConfigMap
metadata:
  name: map-1
  namespace: ephemeral
data:
  app.yaml: |
    database:
      host: db.example.com
      port: 5432
    logLevel: info
  owner: platform-team
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: map-2
  namespace: ephemeral
data:
  app.yaml: |
    database:
      port: 5433
    cache:
      enabled: true
  owner: app-team
---
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: envcfg-1
data:
  environment: staging
  flags:
    debug: true
---
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: envcfg-2
data:
  environment: production
  flags:
    region: us-east-1
