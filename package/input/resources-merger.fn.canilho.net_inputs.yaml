---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: inputs.resources-merger.fn.canilho.net
spec:
  group: resources-merger.fn.canilho.net
  names:
    categories:
    - crossplane
    kind: Input
    listKind: InputList
    plural: inputs
    singular: input
  scope: Namespaced
  versions:
  - name: v1alpha2
    schema:
      openAPIV3Schema:
        description: Input can be used to provide input to this Function.
        properties:
          allowedSourceNamespaces:
            description: |-
              AllowedSourceNamespaces lists the namespaces a source may be read from
              besides the composite resource's own, when that source also sets
              allowCrossNamespace. Ignored for a cluster scoped composite.
            items:
              type: string
            type: array
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          debug:
            type: boolean
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          mergeStrategy:
            description: MergeStrategy selects how a source is merged onto the accumulator.
            enum:
            - Replace
            - MergeObjects
            - ForceMergeObjects
            - MergeObjectsAppendArrays
            - ForceMergeObjectsAppendArrays
            type: string
          metadata:
            type: object
          parseEmbedded:
            description: |-
              ParseEmbedded decodes string values that are YAML mappings so their
              contents deep merge instead of being replaced wholesale.
            type: boolean
          sources:
            items:
              description: Source is one input to the merge. Order in Input.Sources
                is precedence order.
              properties:
                allowCrossNamespace:
                  description: |-
                    AllowCrossNamespace permits this source to be read from a namespace other
                    than the composite resource's own. The namespace must also appear in
                    Input.AllowedSourceNamespaces. Only meaningful when the composite is
                    namespaced; ignored when it is cluster scoped, where cross namespace
                    reads are already the norm.
                  type: boolean
                fromFieldPath:
                  description: FromFieldPath defaults to data.
                  type: string
                name:
                  description: Name is unique across sources. It is the required resource
                    key.
                  type: string
                ref:
                  description: ResourceRef identifies one existing resource.
                  properties:
                    apiVersion:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      description: Namespace is empty for cluster scoped kinds such
                        as EnvironmentConfig.
                      type: string
                  required:
                  - apiVersion
                  - kind
                  - name
                  type: object
                resolution:
                  description: Resolution says whether a source must exist.
                  enum:
                  - Required
                  - Optional
                  type: string
              required:
              - name
              - ref
              type: object
            minItems: 1
            type: array
          target:
            description: Target specifies the resource to create.
            properties:
              apiVersion:
                type: string
              kind:
                type: string
              metadata:
                description: |-
                  TargetMetadata carries only what a merged resource needs. metav1.ObjectMeta
                  would leak ownerReferences, finalizers and managedFields into the schema, and
                  controller-gen renders it as an opaque object with no properties.
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    type: object
                type: object
              name:
                type: string
              nameFromCompositeFieldPath:
                type: string
              namespace:
                type: string
              namespaceFromCompositeFieldPath:
                type: string
              toFieldPath:
                description: ToFieldPath defaults to data.
