---
apiVersion: meta.pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-resources-merger
  annotations:
    meta.crossplane.io/maintainer: Paulo Canilho <paulo@canilho.net>
    meta.crossplane.io/source: github.com/pcanilho/crossplane-function-resources-merger
    meta.crossplane.io/license: Apache-2.0
    meta.crossplane.io/description: An arbitrary resources merger function.
    meta.crossplane.io/readme: |
      This is a crossplane function that merges any Kubernetes resources which contain a root `data` field in their spec and
      produces a single resulting resource containing the merged result.
spec:
  crossplane:
    # The function reads req.RequiredResources, which Crossplane only began
    # populating in v2.0.0. Capability advertisement did not start until
    # v2.2, but the guard in fn.go deliberately tolerates a Crossplane that
    # predates it, so v2.2.0 is not the real floor here.
    version: ">=v2.0.0"
  # Not required: GetCapabilities() already returns [composition] when this
  # field is nil, since composition functions predate the capability concept.
  # Set here for explicitness only.
  capabilities:
  - composition
